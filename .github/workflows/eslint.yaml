name: eslint

on: [push, pull_request]

jobs:
  eslint:
    name: Next Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PicImpact
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      # 公开 API 契约校验：防止后续改动悄悄打断已发布的 iOS App
      # （删字段 / 改名 / 改类型都会被拦下；详见 docs/superpowers/api/public-api-v1.md）
      - name: Verify public API contract
        run: pnpm run api:verify-contract