<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 768" width="2048" height="768">
  <g transform="translate(64, 64) scale(0.625)">

  <!-- 大福映画 Felina Gallery · 图标（美短虎斑）
       颜色：银灰毛 #C6C7C2 / 虎斑纹与描边 #4C3C33（ACNH 图标统一深棕）
             白口吻胸 #F7F3DF（ACNH 纸色）/ 绿眼 #5AA15B（ACNH icon-variant）
             耳内鼻头 #E68E6D（ACNH icon-diy）/ 项圈 #19C8B9 / 铃铛 #FFCF4F -->
  <rect x="28" y="28" width="968" height="968" rx="200" fill="#F7F3DF" stroke="#C4B89E" stroke-width="24"/>

  <!-- 耳朵（银灰 + 深色耳尖 + 陶土色内耳） -->
  <path d="M296 448 L318 262 L486 366 Z" fill="#C6C7C2" stroke="#4C3C33" stroke-width="22" stroke-linejoin="round"/>
  <path d="M728 448 L706 262 L538 366 Z" fill="#C6C7C2" stroke="#4C3C33" stroke-width="22" stroke-linejoin="round"/>
  <path d="M318 262 L332 320 L370 330 Z" fill="#4C3C33"/>
  <path d="M706 262 L692 320 L654 330 Z" fill="#4C3C33"/>
  <path d="M352 396 L364 322 L438 368 Z" fill="#E68E6D"/>
  <path d="M672 396 L660 322 L586 368 Z" fill="#E68E6D"/>

  <!-- 头（银灰虎斑） -->
  <ellipse cx="512" cy="556" rx="264" ry="236" fill="#C6C7C2" stroke="#4C3C33" stroke-width="22"/>

  <!-- 额头虎斑 "M" -->
  <path d="M420 396 L456 456 L492 404 L512 448 L532 404 L568 456 L604 396"
        fill="none" stroke="#4C3C33" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 头顶两道短纹 -->
  <path d="M462 348 L478 388" stroke="#4C3C33" stroke-width="18" stroke-linecap="round"/>
  <path d="M562 348 L546 388" stroke="#4C3C33" stroke-width="18" stroke-linecap="round"/>
  <!-- 脸颊虎斑（每侧两道） -->
  <g stroke="#4C3C33" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M282 546 L344 558"/><path d="M286 606 L344 600"/>
    <path d="M742 546 L680 558"/><path d="M738 606 L680 600"/>
  </g>

  <!-- 白口吻 -->
  <ellipse cx="512" cy="646" rx="132" ry="96" fill="#F7F3DF"/>
  <!-- 腮红 -->
  <ellipse cx="352" cy="622" rx="50" ry="32" fill="#F8A6B2" opacity="0.6"/>
  <ellipse cx="672" cy="622" rx="50" ry="32" fill="#F8A6B2" opacity="0.6"/>

  <!-- 眼睛（绿瞳 + 高光） -->
  <ellipse cx="414" cy="530" rx="46" ry="52" fill="#F7F3DF" stroke="#4C3C33" stroke-width="18"/>
  <ellipse cx="414" cy="532" rx="24" ry="30" fill="#5AA15B"/>
  <circle cx="406" cy="520" r="10" fill="#F7F3DF"/>
  <ellipse cx="610" cy="530" rx="46" ry="52" fill="#F7F3DF" stroke="#4C3C33" stroke-width="18"/>
  <ellipse cx="610" cy="532" rx="24" ry="30" fill="#5AA15B"/>
  <circle cx="602" cy="520" r="10" fill="#F7F3DF"/>

  <!-- 鼻子 + 嘴 -->
  <path d="M486 612 L538 612 L512 640 Z" fill="#E68E6D" stroke="#4C3C33" stroke-width="14" stroke-linejoin="round"/>
  <path d="M512 640 q-28 38 -56 6" fill="none" stroke="#4C3C33" stroke-width="15" stroke-linecap="round"/>
  <path d="M512 640 q28 38 56 6" fill="none" stroke="#4C3C33" stroke-width="15" stroke-linecap="round"/>

  <!-- 胡须 -->
  <g stroke="#4C3C33" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M336 596 L214 566"/><path d="M332 638 L206 638"/><path d="M336 680 L214 710"/>
    <path d="M688 596 L810 566"/><path d="M692 638 L818 638"/><path d="M688 680 L810 710"/>
  </g>

  <!-- 项圈 + 铃铛 -->
  <path d="M306 700 q206 104 412 0" fill="none" stroke="#19C8B9" stroke-width="32" stroke-linecap="round"/>
  <circle cx="512" cy="768" r="44" fill="#FFCF4F" stroke="#4C3C33" stroke-width="18"/>
  <path d="M476 768 h72" stroke="#4C3C33" stroke-width="13" stroke-linecap="round"/>
  <circle cx="512" cy="789" r="9" fill="#4C3C33"/>

  </g>
  <text x="768" y="360" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif"
        font-size="150" font-weight="800" fill="#725D42" letter-spacing="6">大福映画</text>
  <text x="772" y="490" font-family="Nunito, Noto Sans SC, -apple-system, sans-serif"
        font-size="86" font-weight="800" fill="#19C8B9" letter-spacing="4">Felina Gallery</text>
  <rect x="772" y="540" width="220" height="14" rx="7" fill="#C4B89E"/>
</svg>
